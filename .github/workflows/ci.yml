name: CI

# The same gates, in the same order, as the release checklist: lint, unit tests,
# build, the serverless graph check, the MCP build, then the browser tests.
# No secrets are used, and AI stays off (VITE_AI_ENABLED is never set), so the
# app runs fully local and no test can reach an LLM.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node (version pinned in .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Confirm AI is off
        run: |
          if [ -n "${VITE_AI_ENABLED:-}" ]; then
            echo "VITE_AI_ENABLED must be unset in CI (AI stays off)." >&2
            exit 1
          fi
          echo "VITE_AI_ENABLED is unset: AI is off."

      - name: "Gate 1: Lint"
        run: npm run lint

      - name: "Gate 2: Unit tests"
        run: npm test

      - name: "Gate 3: Build"
        run: npm run build

      - name: "Gate 4: Serverless API graph (check:api)"
        run: npm run check:api

      - name: "Gate 5: MCP server build (mcp:build)"
        run: npm run mcp:build

      - name: Install Playwright browser (Chromium only, with system dependencies)
        run: npx playwright install --with-deps chromium

      - name: "Gate 6: End-to-end tests (Playwright)"
        run: npm run test:e2e

      - name: Upload the Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
